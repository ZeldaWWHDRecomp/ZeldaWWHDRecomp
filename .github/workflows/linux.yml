# Linux build check: builds the Vulkan/SDL3 runtime against placeholder guest code
# (tools/recomp/stubgen.py; no game files involved), runs the unit tests and the renderer
# smoke test on Mesa's software Vulkan driver (lavapipe) with the Khronos validation layer.
name: linux

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SDL3_VERSION: release-3.2.24
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config zlib1g-dev liblz4-dev \
            libvulkan-dev glslang-dev glslang-tools mesa-vulkan-drivers vulkan-validationlayers xvfb \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Cache SDL3
        id: sdl3
        uses: actions/cache@v4
        with:
          path: ~/sdl3
          key: sdl3-${{ env.SDL3_VERSION }}-ubuntu-24.04

      - name: Build SDL3
        if: steps.sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL3_VERSION" https://github.com/libsdl-org/SDL.git sdl3-src
          cmake -S sdl3-src -B sdl3-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$HOME/sdl3"
          cmake --build sdl3-build
          cmake --install sdl3-build

      - name: Configure
        run: |
          python3 tools/recomp/stubgen.py build/gen-stub
          cmake -S . -B build/linux -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DGEN_DIR="$PWD/build/gen-stub" -DCMAKE_PREFIX_PATH="$HOME/sdl3"

      - name: Build
        run: cmake --build build/linux

      - name: Unit tests
        run: |
          ctest --test-dir build/linux --output-on-failure
          python3 tools/recomp/test_builds.py

      - name: Renderer smoke test (lavapipe + validation)
        env:
          WWHD_VK_VALIDATION: "1"
        run: |
          export LD_LIBRARY_PATH="$HOME/sdl3/lib"
          xvfb-run -a -s "-screen 0 1920x1080x24" ./build/linux/wwhd --renderer-smoke 2>&1 | tee smoke.log
          grep -q "PASS" smoke.log
          ! grep -q "VUID" smoke.log

      - name: BC fallback smoke test (lavapipe + validation)
        env:
          WWHD_VK_VALIDATION: "1"
          WWHD_VK_FORCE_BC_DECODE: "1"
          WWHD_VK_BC_VERIFY: "1"
        run: |
          export LD_LIBRARY_PATH="$HOME/sdl3/lib"
          xvfb-run -a -s "-screen 0 1920x1080x24" ./build/linux/wwhd --renderer-smoke 2>&1 | tee bc-smoke.log
          grep -q "BC production uploads" bc-smoke.log
          grep -q "synthetic GPU/CPU checks PASS" bc-smoke.log
          ! grep -q "VUID" bc-smoke.log
