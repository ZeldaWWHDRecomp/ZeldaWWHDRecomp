# Release build: packages the runtime, tools and installer for macOS (arm64), Linux (x86-64) and
# Windows (x86-64) and publishes them as a GitHub Release.
#
# Legal: CI never has the game. Every build here uses placeholder guest code
# (tools/recomp/stubgen.py) only to compile and test the runtime; the real game code is generated
# and compiled on the player's machine by the installer. tools/release/guard.py fails the job if
# an artifact contains game code, game files, saves, shader caches or key-like strings.
#
# Triggers: pushing a tag v* publishes a release. "Run workflow" (workflow_dispatch) builds and
# checks the same artifacts without publishing (dry run); with dry_run unchecked on a v* tag it
# publishes too.
#
# Toolchains: tools/installer/toolchains.json pins the exact compilers. The Windows and Linux
# runtimes are built with the same pinned llvm-mingw / zig the installer downloads for players,
# so the prebuilt runtime links with the player's locally compiled game code.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and check the artifacts, do not publish"
        type: boolean
        default: true

permissions:
  contents: read

env:
  SDL3_URL: https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.tar.gz
  SDL3_SHA256: 9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3
  VULKAN_HEADERS_URL: https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.363.tar.gz
  VULKAN_HEADERS_SHA256: cbaf687d3c59b9666fe080e7f8396b6b4f4d344a768ee6b337c59852f4526b68
  VULKAN_DEF_URL: https://raw.githubusercontent.com/KhronosGroup/Vulkan-Loader/vulkan-sdk-1.4.363.0/loader/vulkan-1.def
  VULKAN_DEF_SHA256: 9ba339b7f5ee2df28487698a6840ecf095fac58b415c2c89ad9f161e9d316378

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dryrun-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then publish=true; fi
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.dry_run }}" == false ]]; then publish=true; fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version: $(grep version= "$GITHUB_OUTPUT"), publish: $publish"

  macos:
    needs: version
    # macOS 15 SDK (Xcode 16) needed: the Metal renderer uses MTLMathMode; the app runs on macOS 14+
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ninja

      - name: Build runtime (Release, Metal) against placeholder guest code
        run: |
          python3 tools/recomp/stubgen.py build/gen-stub
          cmake -S . -B build/rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DWWHD_VERSION="$VERSION" -DWWHD_RENDERER=METAL \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DGEN_DIR="$PWD/build/gen-stub" -DWWHD_SETUP_GUI=ON \
            -DWWHD_BUNDLED_ZSTD=ON
          cmake --build build/rel

      - name: Unit tests
        run: |
          ctest --test-dir build/rel --output-on-failure
          python3 tools/installer/test_setup.py
          python3 tools/recomp/test_builds.py

      - name: Package
        run: |
          python3 tools/release/package.py --build build/rel --platform macos-arm64 --version "$VERSION" \
            --out dist --toolchain xcode-clt --setup-gui build/rel/wwhd-setup

      - name: Guard (no game code, game files or keys)
        run: python3 tools/release/guard.py dist/*.zip

      - name: Installer self-test (unzipped release, placeholder code)
        run: |
          mkdir -p "$RUNNER_TEMP/unz" && cd "$RUNNER_TEMP/unz" && unzip -q "$GITHUB_WORKSPACE"/dist/*.zip
          cd WindWakerHD-*
          bash "./tools/Setup in Terminal.command" --yes --no-launch --gen-dir "$GITHUB_WORKSPACE/build/gen-stub" \
            --data-dir "$RUNNER_TEMP/data"
          "$RUNNER_TEMP/data/bin/wwhd" --game "$RUNNER_TEMP/nogame" > run.log 2>&1 || true
          cat run.log
          grep -q "cannot load" run.log
          # the graphical installer: starts setup.py through the launcher and renders its first screen
          SDL_VIDEO_DRIVER=offscreen "./Wind Waker HD.app/Contents/MacOS/wind-waker-hd" --self-test \
            --screenshots "$RUNNER_TEMP" --data-dir "$RUNNER_TEMP/data"
          mkdir -p "$GITHUB_WORKSPACE/gui-shots" && cp "$RUNNER_TEMP"/selftest-*.png "$GITHUB_WORKSPACE/gui-shots/"

      - uses: actions/upload-artifact@v4
        with:
          name: setup-gui-macos-arm64
          path: gui-shots

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  linux:
    needs: version
    # x86-64 and arm64 (aarch64), each built and tested on its own architecture's runner.
    # glibc 2.35: the oldest base the release supports (Ubuntu 22.04, Debian 12, Fedora 36, SteamOS 3,
    # Raspberry Pi OS 12 64-bit)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            toolchain: zig-0.16.0
          - arch: aarch64
            runner: ubuntu-22.04-arm
            toolchain: zig-0.16.0-aarch64
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # SDL3's documented Linux build dependencies (SDL3 docs/README-linux.md, Ubuntu 22.04+ set), so
          # the shipped SDL3 has every backend (X11, Wayland, PipeWire/PulseAudio/ALSA, input, IME);
          # libvulkan1 is only linked against (players use their own Vulkan loader)
          sudo apt-get install -y build-essential cmake ninja-build pkg-config xz-utils libvulkan1 \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev wayland-protocols \
            mesa-vulkan-drivers xvfb

      - name: Pinned zig toolchain (tools/installer/toolchains.json)
        run: |
          read -r URL SUM DIR TARGET < <(python3 -c "
          import json, os; t=json.load(open('tools/installer/toolchains.json'))['toolchains'][os.environ['TOOLCHAIN']]
          print(t['url'], t['sha256'], t['dir'], t['target'])")
          echo "ZIG_DIR=$RUNNER_TEMP/$DIR" >> "$GITHUB_ENV"
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" "$URL"
          echo "$SUM  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          ZIG="$RUNNER_TEMP/$DIR/zig"
          mkdir -p "$RUNNER_TEMP/zbin"
          printf '#!/bin/sh\nexec "%s" cc -target %s "$@"\n' "$ZIG" "$TARGET" > "$RUNNER_TEMP/zbin/zcc"
          printf '#!/bin/sh\nexec "%s" c++ -target %s "$@"\n' "$ZIG" "$TARGET" > "$RUNNER_TEMP/zbin/zcxx"
          printf '#!/bin/sh\nexec "%s" ar "$@"\n' "$ZIG" > "$RUNNER_TEMP/zbin/zar"
          printf '#!/bin/sh\nexec "%s" ranlib "$@"\n' "$ZIG" > "$RUNNER_TEMP/zbin/zranlib"
          chmod +x "$RUNNER_TEMP"/zbin/*
          echo "ZBIN=$RUNNER_TEMP/zbin" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-cache" >> "$GITHUB_ENV"

      - name: SDL3 (shared library, system compiler, shipped next to the game)
        run: |
          curl -fsSL -o sdl3.tar.gz "$SDL3_URL"
          echo "$SDL3_SHA256  sdl3.tar.gz" | sha256sum -c -
          tar -xzf sdl3.tar.gz
          cmake -S SDL3-3.4.18 -B sdl3-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$HOME/sdl3"
          cmake --build sdl3-build
          cmake --install sdl3-build

      - name: Vulkan headers
        run: |
          curl -fsSL -o vh.tar.gz "$VULKAN_HEADERS_URL"
          echo "$VULKAN_HEADERS_SHA256  vh.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/vulkan" && tar -xzf vh.tar.gz -C "$HOME/vulkan" --strip-components=1

      - name: Build runtime (Release, Vulkan + SDL3) with zig against placeholder guest code
        run: |
          python3 tools/recomp/stubgen.py build/gen-stub
          cmake -S . -B build/rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DWWHD_VERSION="$VERSION" -DGEN_DIR="$PWD/build/gen-stub" \
            -DCMAKE_C_COMPILER="$ZBIN/zcc" -DCMAKE_CXX_COMPILER="$ZBIN/zcxx" \
            -DCMAKE_AR="$ZBIN/zar" -DCMAKE_RANLIB="$ZBIN/zranlib" \
            -DWWHD_BUNDLED_DEPS=ON -DCMAKE_PREFIX_PATH="$HOME/sdl3" -DWWHD_SETUP_GUI=ON \
            -DVulkan_INCLUDE_DIR="$HOME/vulkan/include" \
            -DVulkan_LIBRARY="/usr/lib/$ARCH-linux-gnu/libvulkan.so.1"
          cmake --build build/rel

      - name: Unit tests
        run: |
          export LD_LIBRARY_PATH="$HOME/sdl3/lib"
          ctest --test-dir build/rel --output-on-failure
          python3 tools/installer/test_setup.py
          python3 tools/recomp/test_builds.py

      - name: Package
        run: |
          python3 tools/release/package.py --build build/rel --platform "linux-$ARCH" --version "$VERSION" \
            --out dist --toolchain "$TOOLCHAIN" --setup-gui build/rel/wwhd-setup \
            --runtime-file "$HOME/sdl3/lib/libSDL3.so.0" \
            --linkonly-lib "/usr/lib/$ARCH-linux-gnu/libvulkan.so.1" \
            --license "SDL3 (zlib)=$PWD/SDL3-3.4.18/LICENSE.txt" \
            --license "Vulkan-Headers (Apache-2.0)=$HOME/vulkan/LICENSE.md" \
            --license "glslang (BSD-3-Clause and others)=$PWD/build/rel/_deps/glslang-src/LICENSE.txt" \
            --license "zlib (zlib)=$PWD/build/rel/_deps/zlib-src/LICENSE" \
            --license "LZ4 (BSD-2-Clause)=$PWD/build/rel/_deps/lz4-src/lib/LICENSE" \
            --license "LLVM libc++ (Apache-2.0 WITH LLVM-exception)=$ZIG_DIR/lib/libcxx/LICENSE.TXT"

      - name: Guard (no game code, game files or keys)
        run: python3 tools/release/guard.py dist/*.zip

      - name: Installer self-test (unzipped release, placeholder code, toolchain download)
        run: |
          mkdir -p "$RUNNER_TEMP/unz" && cd "$RUNNER_TEMP/unz" && unzip -q "$GITHUB_WORKSPACE"/dist/*.zip
          cd WindWakerHD-*
          ./tools/setup-in-terminal.sh --yes --no-launch --gen-dir "$GITHUB_WORKSPACE/build/gen-stub" --data-dir "$RUNNER_TEMP/data"
          # the right architecture: the game the installer linked and the program a player starts
          want=$([ "$ARCH" = aarch64 ] && echo "ARM aarch64" || echo "x86-64")
          file "$RUNNER_TEMP/data/bin/wwhd" ./wind-waker-hd
          file "$RUNNER_TEMP/data/bin/wwhd" | grep -q "$want"
          file ./wind-waker-hd | grep -q "$want"
          ldd "$RUNNER_TEMP/data/bin/wwhd"
          "$RUNNER_TEMP/data/bin/wwhd" --game "$RUNNER_TEMP/nogame" > run.log 2>&1 || true
          cat run.log
          grep -q "cannot load" run.log
          ldd ./wind-waker-hd
          SDL_VIDEO_DRIVER=offscreen ./wind-waker-hd --self-test --data-dir "$RUNNER_TEMP/data"

      - name: Renderer smoke test of the installed executable (lavapipe)
        # the 22.04 runner's Mesa is old; a failure here is reported but does not block the release
        continue-on-error: true
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" "$RUNNER_TEMP/data/bin/wwhd" --renderer-smoke 2>&1 | tee smoke.log
          grep -q "PASS" smoke.log

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Pinned llvm-mingw toolchain (tools/installer/toolchains.json)
        run: |
          read -r URL SUM DIR < <(python -c "
          import json; t=json.load(open('tools/installer/toolchains.json'))['toolchains']['llvm-mingw-20260922']
          print(t['url'], t['sha256'], t['dir'])" | tr -d '\r')  # Windows Python ends lines with CR LF
          T="$(cygpath -m "$RUNNER_TEMP")"
          curl -fsSL -o "$T/llvm-mingw.zip" "$URL"
          echo "$SUM  $T/llvm-mingw.zip" | sha256sum -c -
          unzip -q "$T/llvm-mingw.zip" -d "$T"
          echo "LLVM_MINGW=$T/$DIR" >> "$GITHUB_ENV"
          echo "$T/$DIR/bin" >> "$GITHUB_PATH"
          "$T/$DIR/bin/x86_64-w64-mingw32-clang.exe" --version
          pip install ninja
          ninja --version

      - name: Vulkan headers and import library
        run: |
          T="$(cygpath -m "$RUNNER_TEMP")"
          curl -fsSL -o vh.tar.gz "$VULKAN_HEADERS_URL"
          echo "$VULKAN_HEADERS_SHA256  vh.tar.gz" | sha256sum -c -
          mkdir -p "$T/vulkan" && tar -xzf vh.tar.gz -C "$T/vulkan" --strip-components=1
          curl -fsSL -o vulkan-1.def "$VULKAN_DEF_URL"
          echo "$VULKAN_DEF_SHA256  vulkan-1.def" | sha256sum -c -
          "$LLVM_MINGW/bin/llvm-dlltool.exe" -m i386:x86-64 -d vulkan-1.def -l "$T/vulkan/libvulkan-1.a"
          echo "VULKAN_DIR=$T/vulkan" >> "$GITHUB_ENV"

      - name: Build runtime (Release, Vulkan + SDL3) with llvm-mingw against placeholder guest code
        run: |
          python tools/recomp/stubgen.py build/gen-stub
          cmake -S . -B build/rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DWWHD_VERSION="$VERSION" -DGEN_DIR="$(cygpath -m "$PWD/build/gen-stub")" \
            -DCMAKE_C_COMPILER="$LLVM_MINGW/bin/x86_64-w64-mingw32-clang.exe" \
            -DCMAKE_CXX_COMPILER="$LLVM_MINGW/bin/x86_64-w64-mingw32-clang++.exe" \
            -DCMAKE_RC_COMPILER="$LLVM_MINGW/bin/x86_64-w64-mingw32-windres.exe" \
            -DCMAKE_EXE_LINKER_FLAGS=-static -DWWHD_BUNDLED_DEPS=ON -DWWHD_SETUP_GUI=ON \
            -DVulkan_INCLUDE_DIR="$VULKAN_DIR/include" -DVulkan_LIBRARY="$VULKAN_DIR/libvulkan-1.a"
          ninja -C build/rel -d keeprsp

      - name: Unit tests
        run: |
          ctest --test-dir build/rel --output-on-failure
          python tools/installer/test_setup.py

      - name: Pinned embeddable Python, shipped in the release (tools/installer/toolchains.json)
        # the setup runs with it (tools/python); the release itself downloads no Python (issue #58)
        run: |
          read -r URL SUM < <(python -c "
          import json; p=json.load(open('tools/installer/toolchains.json'))['python']['windows']
          print(p['url'], p['sha256'])" | tr -d '\r')
          T="$(cygpath -m "$RUNNER_TEMP")"
          curl -fsSL -o "$T/python-embed.zip" "$URL"
          echo "$SUM  $T/python-embed.zip" | sha256sum -c -
          echo "WIN_PY_ZIP=$T/python-embed.zip" >> "$GITHUB_ENV"

      - name: Package
        run: |
          W="$(cygpath -m "$PWD")"  # native Windows Python cannot open /d/a/... paths
          python tools/release/package.py --build build/rel --platform windows-x86_64 --version "$VERSION" \
            --out dist --toolchain llvm-mingw-20260922 --setup-gui build/rel/wwhd-setup.exe \
            --windows-python "$WIN_PY_ZIP" \
            --runtime-file build/rel/SDL3.dll \
            --license "SDL3 (zlib)=$W/build/rel/_deps/sdl3-src/LICENSE.txt" \
            --license "Vulkan-Headers (Apache-2.0)=$VULKAN_DIR/LICENSE.md" \
            --license "glslang (BSD-3-Clause and others)=$W/build/rel/_deps/glslang-src/LICENSE.txt" \
            --license "zlib (zlib)=$W/build/rel/_deps/zlib-src/LICENSE" \
            --license "LZ4 (BSD-2-Clause)=$W/build/rel/_deps/lz4-src/lib/LICENSE" \
            --license "LLVM libc++ (Apache-2.0 WITH LLVM-exception)=$LLVM_MINGW/LICENSE.TXT"

      - name: Guard (no game code, game files or keys)
        run: python tools/release/guard.py dist/*.zip

      - name: Unzip the release for the installer self-test
        shell: pwsh
        run: |
          $unz = Join-Path $env:RUNNER_TEMP 'unz'
          New-Item -ItemType Directory -Force -Path $unz | Out-Null
          Expand-Archive -Path (Get-ChildItem dist\*.zip).FullName -DestinationPath $unz
          $pkg = (Get-ChildItem $unz -Directory)[0].FullName
          "WWHD_PKG=$pkg" >> $env:GITHUB_ENV
          "WWHD_DATA_DIR=$(Join-Path $env:RUNNER_TEMP 'data')" >> $env:GITHUB_ENV
          # no script host in the Windows release (antivirus false positives, issue #58)
          if (Get-ChildItem $pkg -Recurse -Include *.ps1, *.vbs, *.js, *.hta) { throw "a script file is in the release" }
          $bytes = [IO.File]::ReadAllBytes((Join-Path $pkg 'Wind Waker HD.exe'))
          foreach ($enc in [Text.Encoding]::ASCII, [Text.Encoding]::Unicode) {
            foreach ($word in 'powershell', 'ExecutionPolicy', 'Unblock-File') {
              if ($enc.GetString($bytes).IndexOf($word, [StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "Wind Waker HD.exe contains '$word'" }
            }
          }
          # no download code: no network library among its imports (import names are ASCII)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($dll in 'winhttp.dll', 'wininet.dll', 'urlmon.dll', 'ws2_32.dll', 'bcrypt.dll') {
            if ($ascii.IndexOf($dll, [StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "Wind Waker HD.exe imports $dll" }
          }
          # the bundled Python is the official one, unmodified: its programs and DLLs keep the PSF signature
          foreach ($f in 'python.exe', 'pythonw.exe', 'python3.dll', 'python313.dll') {
            $sig = Get-AuthenticodeSignature (Join-Path $pkg "tools\python\$f")
            "tools\python\$f`: $($sig.Status), $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Python Software Foundation') {
              throw "tools\python\$f does not carry a valid PSF signature"
            }
          }
          # version information, a manifest and no debug sections (cmake/WindowsResources.cmake, WWHD_STRIP_RELEASE)
          foreach ($f in 'Wind Waker HD.exe', 'tools\bin\wwhd-extract.exe') {
            $p = Join-Path $pkg $f
            $vi = (Get-Item $p).VersionInfo
            if ($vi.ProductName -ne 'Wind Waker HD Recomp' -or $vi.CompanyName -ne 'ZeldaWWHDRecomp') { throw "$f has no version information" }
            "$f`: $($vi.FileDescription), $($vi.ProductVersion), $($vi.OriginalFilename)"
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($p))
            if ($text.IndexOf('.debug_info') -ge 0) { throw "$f still has debug sections" }
            if ($text.IndexOf('requestedExecutionLevel') -lt 0) { throw "$f has no application manifest" }
          }

      - name: Installer self-test, setup in a console window (bundled Python, toolchain download)
        # the .bat as a player starts it (it runs "Wind Waker HD.exe --console-setup"); no input
        shell: cmd
        run: |
          call "%WWHD_PKG%\tools\Setup in a console window.bat" --yes --no-launch --gen-dir "%GITHUB_WORKSPACE%\build\gen-stub" --data-dir "%WWHD_DATA_DIR%" < NUL
          if errorlevel 1 exit /b 1

      - name: Installer self-test (unzipped release, placeholder code)
        shell: pwsh
        run: |
          $pkg = $env:WWHD_PKG
          $data = $env:WWHD_DATA_DIR
          if (Test-Path (Join-Path $data 'python')) { throw "the setup downloaded a Python (it should use tools\python)" }
          if (-not (Test-Path (Join-Path $data 'install.json'))) { throw "the console setup did not finish" }
          $exe = Join-Path $data 'bin\wwhd.exe'
          if (-not (Test-Path (Join-Path $data 'bin\SDL3.dll'))) { throw "SDL3.dll was not installed" }
          # no game files: the executable must start and stop with "cannot load ..." (abort() may leave
          # an error-reporting process around, so do not wait forever)
          $p = Start-Process -FilePath $exe -ArgumentList '--game', (Join-Path $env:RUNNER_TEMP 'nogame') `
            -RedirectStandardError run.log -RedirectStandardOutput out.log -NoNewWindow -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill() }
          Get-Content run.log, out.log
          if (-not (Select-String -Path run.log, out.log -Pattern 'cannot load' -Quiet)) { throw "the installed executable did not start" }
          # the graphical installer (GUI subsystem: wait for it explicitly)
          $env:SDL_VIDEO_DRIVER = 'offscreen'
          $g = Start-Process -FilePath (Join-Path $pkg 'Wind Waker HD.exe') `
            -ArgumentList '--self-test', '--data-dir', $data -PassThru
          $null = $g.Handle  # keeps the process handle so ExitCode is available after it exits
          if (-not $g.WaitForExit(600000)) { $g.Kill(); throw "the setup program did not finish its self-test" }
          if ($g.ExitCode -ne 0) { throw "setup program self-test failed ($($g.ExitCode))" }
          # the window on a fresh data folder: setup.py starts with the bundled Python, nothing is downloaded
          $env:WWHD_DATA_DIR = Join-Path $env:RUNNER_TEMP 'data-gui'
          $g = Start-Process -FilePath (Join-Path $pkg 'Wind Waker HD.exe') `
            -ArgumentList '--self-test', '--data-dir', $env:WWHD_DATA_DIR -PassThru
          $null = $g.Handle
          if (-not $g.WaitForExit(600000)) { $g.Kill(); throw "the setup program did not finish its self-test (fresh data folder)" }
          if ($g.ExitCode -ne 0) { throw "setup program self-test on a fresh data folder failed ($($g.ExitCode))" }
          if (Test-Path (Join-Path $env:WWHD_DATA_DIR 'python')) { throw "the window downloaded a Python" }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  # Uploads every release zip and the Windows "Wind Waker HD.exe" to VirusTotal and writes the results to the
  # job summary and vt-report.json; on a published release the vt-notes job adds them to the release. It never
  # fails the release; the publish job does not wait for it. Without the VT_API_KEY secret it only says so.
  virustotal:
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: VirusTotal scan (monitor only)
        continue-on-error: true
        run: |
          if [ -n "$VT_API_KEY" ]; then echo "::add-mask::$VT_API_KEY"; fi
          files=(dist/*.zip)
          for z in dist/*windows*.zip; do [ -f "$z" ] && files+=("$z:Wind Waker HD.exe"); done
          python3 tools/release/virustotal.py --out vt-report.json --summary "$GITHUB_STEP_SUMMARY" --timeout 600 "${files[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: vt-report
          path: vt-report.json
          if-no-files-found: ignore

  publish:
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Guard all artifacts again
        run: python3 tools/release/guard.py dist/*.zip

      - name: Checksums and release notes
        run: |
          cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          python3 tools/release/notes.py README.md "$VERSION" dist/SHA256SUMS.txt > dist/notes.md
          cat dist/notes.md
          python3 tools/release/guard.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-all
          path: dist/*

      - name: Publish GitHub Release
        if: env.PUBLISH == 'true'
        run: |
          gh release create "$VERSION" dist/*.zip dist/SHA256SUMS.txt --title "$VERSION" --notes-file dist/notes.md \
            --verify-tag

  # Published releases: append the VirusTotal links and counts to the release notes and attach vt-report.json.
  # Runs after both publish and the scan; any failure only leaves the release without the section.
  vt-notes:
    needs: [version, virustotal, publish]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vt-report
          path: vt

      - name: Add the VirusTotal section to the release
        run: |
          section="$(python3 tools/release/virustotal.py --render-notes vt/vt-report.json)"
          if [ -z "$section" ]; then echo "no VirusTotal results: release unchanged"; exit 0; fi
          gh release view "$VERSION" --json body -q .body > notes.md
          printf '\n%s' "$section" >> notes.md
          gh release edit "$VERSION" --notes-file notes.md
          gh release upload "$VERSION" vt/vt-report.json --clobber
