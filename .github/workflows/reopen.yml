# Lets the author of an issue reopen it after a maintainer closed it: GitHub only allows authors to
# reopen issues they closed themselves. The issue's author comments "/reopen" on the closed issue and
# this workflow reopens it. Nobody else can trigger it, and pull requests are ignored.
name: reopen
on:
  issue_comment:
    types: [created]
permissions:
  issues: write
jobs:
  reopen:
    if: >-
      !github.event.issue.pull_request &&
      github.event.issue.state == 'closed' &&
      github.event.comment.user.login == github.event.issue.user.login &&
      startsWith(github.event.comment.body, '/reopen')
    runs-on: ubuntu-latest
    steps:
      - name: Reopen the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue reopen "$ISSUE" --repo "$REPO"
          gh issue comment "$ISSUE" --repo "$REPO" --body "Reopened at the author's request (\`/reopen\`)."
