name: Android secondary display smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - android/**
      - runtime/src/gfx/**
      - runtime/src/main.cpp
      - tools/android/**
      - tools/recomp/**
      - tools/rpx.py
      - tools/installer/setup.py
      - .github/workflows/android-display-smoke.yml

permissions:
  contents: read

jobs:
  display:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v4
      - name: Android native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" "platforms;android-36" "build-tools;35.0.0"
      - name: Build game-free x86_64 test APK
        run: |
          python3 tools/recomp/stubgen.py build/gen-stub
          ABI=x86_64 GEN_DIR="$PWD/build/gen-stub" ANDROID_SDK="$ANDROID_HOME" JOBS=4 android/build_native.sh
          python3 tools/android/prepare_python.py --abi x86_64 --ndk "$ANDROID_HOME/ndk/30.0.16248370" --out build/embedded-python
          android/gradlew -p android --no-daemon -PwwhdAbi=x86_64 -PwwhdPythonDir="$PWD/build/embedded-python/package" assembleDebug
          python3 tools/release/guard.py android/app/build/outputs/apk/debug/*.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Vulkan surfaces, touch, removal and reconnect
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 2048
          disable-animations: true
          script: |
            python3 tools/android/display_smoke.py --serial emulator-5554 --apk android/app/build/outputs/apk/debug/app-debug.apk --require-fence-retirement --require-present-worker --measure-timing --exercise-primary-rotation --exercise-folds --exercise-dismissal --exercise-surface-loss --output build/display-smoke-result.json
            python3 tools/android/shared_image_smoke.py --serial emulator-5554 --apk android/app/build/outputs/apk/debug/app-debug.apk --output build/shared-image-result.json
            python3 tools/android/shared_image_smoke.py --serial emulator-5554 --apk android/app/build/outputs/apk/debug/app-debug.apk --general-layout --output build/shared-image-general-result.json
            python3 tools/android/display_smoke.py --serial emulator-5554 --apk android/app/build/outputs/apk/debug/app-debug.apk --require-isolated-device --require-present-worker --measure-timing --exercise-primary-rotation --exercise-folds --exercise-dismissal --exercise-surface-loss --output build/isolated-display-smoke-result.json
            python3 tools/android/display_startup_smoke.py --serial emulator-5554 --apk android/app/build/outputs/apk/debug/app-debug.apk --output build/display-startup-result.json
            python3 tools/android/activity_recreation_smoke.py --serial emulator-5554 --output build/activity-recreation-result.json
            python3 tools/android/python_smoke.py --serial emulator-5554 --output build/python-smoke-result.json
            python3 tools/android/setup_update_smoke.py --serial emulator-5554 --apk android/app/build/outputs/apk/debug/app-debug.apk --output build/setup-update-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-display-smoke-${{ github.sha }}
          path: |
            build/display-smoke-result.json
            build/display-smoke-result.log
            build/display-smoke-result.displays.txt
            build/display-smoke-result.png
            build/display-smoke-result-swapped.png
            build/display-smoke-result-fold-*.png
            build/shared-image-result.json
            build/shared-image-result.log
            build/shared-image-general-result.json
            build/shared-image-general-result.log
            build/isolated-display-smoke-result*
            build/display-startup-result.json
            build/display-startup-result.log
            build/activity-recreation-result.json
            build/activity-recreation-result.log
            build/python-smoke-result.json
            build/python-smoke-result.log
            build/setup-update-result.json
            build/setup-update-result.log
            build/embedded-python/package/assets/python-build.json
          if-no-files-found: warn
          retention-days: 7
