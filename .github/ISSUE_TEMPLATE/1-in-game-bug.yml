name: In-game bug
description: Something goes wrong while playing (graphics, gameplay, sound, controls, crash during play).
labels: ["bug", "in-game"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! A **save state** made where the problem happens (`slotN.wwstate`, a few KB) plus your **save file** (`cking.sav`) lets us reproduce it much faster, so please add them if you can.

        **Never share full save states** (`slotN.bin`, hundreds of MB): they contain the game's own code and data from your console, which must not be shared publicly. The small `.wwstate` files only hold your progress and position.

        If a maintainer closed your issue and the problem comes back, comment `/reopen` on it (as the person who opened it) and it reopens automatically.
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, and what you expected instead. Screenshots or a short video help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Where in the game, and what you did right before it happened.
      placeholder: |
        1. Go to ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: savefile
    attributes:
      label: Save state and save file, or why you can't add them
      description: |
        **Please attach a save state and your save file** (they only hold your progress and position, a few KB each):
        1. Go to where the problem happens and save a state: **Shift+F1** (or another slot, Shift+F2–F5), or the **Save** button in the Saves tab of the settings overlay (F1). This writes `slotN.wwstate`.
        2. In the Saves tab, **Copy save for bug report** copies where both files are:
           - the state: `slotN.wwstate` in the states folder (shown in the Saves tab)
           - the save file `cking.sav`: `data/save/user/cking.sav` inside the folder you unzipped (release), or `save/user/cking.sav` in the folder you start the game from (built from source, or the folder you pass with `--save`)
        3. Zip both files and drag the zip into this box.

        Also say where you were and what you did (island or dungeon, room, which file slot).

        **Never attach or link full save states** (`slotN.bin`, hundreds of MB, made with the "Full save states" option): they contain the game's code and data and must not be shared.
        If you can't add the files, write the reason here instead.
      placeholder: "state.zip attached (slot1.wwstate + cking.sav), file 1, standing at ... or: no files because ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release (e.g. v0.2.1), or the commit if you built it yourself (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux (x86-64)
        - Linux (arm64)
        - Android
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: CPU, GPU and RAM (e.g. "Ryzen 5 5600, RTX 3060, 16 GB" or "M1, 8 GB").
    validations:
      required: true
  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      options:
        - Metal
        - Vulkan
        - Don't know
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If the game crashed: the newest `crash-<date>-<time>.log` from `data/captures/` (release) or `captures/` (built from source). If the setup failed: `data/setup.log`. Drag the file in here.
