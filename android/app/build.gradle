// The native libraries are built by android/build_native.sh into app/libs/arm64-v8a (libmain.so is
// the recompiled game: build it from your own game, and keep the APK to yourself).
plugins {
    id 'com.android.application'
}

android {
    namespace = "org.wwhdrecomp.wwhd"
    compileSdk 36
    buildToolsVersion "35.0.0"  // pinned (the CI installs this one)
    ndkVersion "30.0.16248370"  // android/build_native.sh's default (the native libraries come from there)
    defaultConfig {
        applicationId "dev.windwake.android"
        buildConfigField 'boolean', 'QUEST_THEATER', providers.gradleProperty('wwhdQuestTheater').getOrElse('false')
        testInstrumentationRunner "org.wwhdrecomp.wwhd.WindwakeInstrumentation"
        minSdk 33
        targetSdk 36
        // release.yml passes the release version and a growing build number; local builds keep these
        versionCode providers.gradleProperty('wwhdVersionCode').map { it as int }.getOrElse(3)
        versionName providers.gradleProperty('wwhdVersionName').getOrElse('0.3.0-windwake')
        ndk { abiFilters providers.gradleProperty('wwhdAbi').getOrElse('arm64-v8a') }
    }
    buildFeatures { buildConfig true }
    // Release signing (release.yml: the project's key, decoded to a temporary file for the build).
    // Environment WWHD_KEYSTORE, WWHD_KEYSTORE_PASSWORD, WWHD_KEY_ALIAS and optional WWHD_KEY_PASSWORD
    // (default: the store password), or -PwwhdKeystore=... etc. Without them (forks, your own build)
    // the release APK is signed with the local debug key, as before.
    def signing = { String env, String property ->  // empty counts as unset (a missing CI secret)
        [providers.environmentVariable(env).orNull, providers.gradleProperty(property).orNull].find { it }
    }
    def releaseKeystore = signing('WWHD_KEYSTORE', 'wwhdKeystore')
    signingConfigs {
        if (releaseKeystore != null) {
            release {
                def storePass = signing('WWHD_KEYSTORE_PASSWORD', 'wwhdKeystorePassword')
                def alias = signing('WWHD_KEY_ALIAS', 'wwhdKeyAlias')
                if (storePass == null || alias == null)
                    throw new GradleException('Release signing needs the keystore password and key alias too')
                storeFile file(releaseKeystore)
                storePassword storePass
                keyAlias alias
                keyPassword signing('WWHD_KEY_PASSWORD', 'wwhdKeyPassword') ?: storePass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false  // no R8: SDL and the JNI bridges look classes and methods up by name
            signingConfig releaseKeystore != null ? signingConfigs.release : signingConfigs.debug
        }
    }
    sourceSets.main.jniLibs.srcDirs = ['libs']
    // Pinned v0.5.0 runtime plus the verified, authored startup-touch object; no game code.
    def runtimePackage = rootProject.file('../build/vendor/runtime-v0.5.0-windwake')
    sourceSets.main.jniLibs.srcDirs += [new File(runtimePackage, 'jniLibs')]
    sourceSets.main.assets.srcDirs += [new File(runtimePackage, 'assets')]
    def pythonPackage = providers.gradleProperty('wwhdPythonDir').orNull
    if (pythonPackage != null) {
        sourceSets.main.jniLibs.srcDirs += [file(pythonPackage + '/jniLibs')]
        sourceSets.main.assets.srcDirs += [file(pythonPackage + '/assets')]
    }
    def toolchainPackage = providers.gradleProperty('wwhdToolchainDir').orNull
    if (toolchainPackage != null) {
        sourceSets.main.jniLibs.srcDirs += [file(toolchainPackage + '/jniLibs')]
        sourceSets.main.assets.srcDirs += [file(toolchainPackage + '/assets')]
    }
    def extractorPackage = providers.gradleProperty('wwhdExtractorDir').orNull
    if (extractorPackage != null) {
        sourceSets.main.jniLibs.srcDirs += [file(extractorPackage + '/jniLibs')]
        sourceSets.main.assets.srcDirs += [file(extractorPackage + '/assets')]
    }
    // the game's own icon (android/make_icon.py, from your game files; git-ignored), else the app icon (android/icon)
    def gameIcon = file('local-res').exists()
    if (gameIcon) sourceSets.main.res.srcDirs += ['local-res']
    defaultConfig.manifestPlaceholders = [appIcon: '@drawable/ic_windwake',
        questTheaterEnabled: providers.gradleProperty('wwhdQuestTheater').getOrElse('false')]
    packaging {
        jniLibs {
            useLegacyPackaging = true  // libadrenotools needs extracted hooks in nativeLibraryDir
            keepDebugSymbols += ['**/libmain.so', '**/libwwhd-*.so'] // executable tools have pinned checksums
            if (toolchainPackage != null || extractorPackage != null) keepDebugSymbols += ['**/libwwhd-*.so']  // preserve pinned tool bytes
        }
    }
    lint { abortOnError = false }
}

dependencies {
    if (providers.gradleProperty('wwhdQuestTheater').getOrElse('false') == 'true')
        implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.63'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.window:window:1.5.1'
    implementation 'androidx.window:window-java:1.5.1'
}

tasks.register('verifyReleasePython') {
    doLast {
        def pythonPackage = providers.gradleProperty('wwhdPythonDir').orNull
        if (pythonPackage != null) {
            def archive = new java.util.zip.ZipFile(file(pythonPackage + '/assets/python-source.zip'))
            try {
                if (['tools/android/service_fixture.py', 'tools/android/debug_fixture_build.py',
                     'tools/android/embedding_smoke.py', 'tools/recomp/android_fixture.py',
                     'tools/android/extraction-fixture.bin', 'tools/android/runtime_fixture.c'].any { archive.getEntry(it) != null })
                    throw new GradleException('Synthetic service resources are debug-only; repackage Python without --service-fixture')
            } finally { archive.close() }
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'verifyReleasePython' }

tasks.register('verifyWindwakeRuntime') {
    doLast {
        def runtime = rootProject.file('../build/vendor/runtime-v0.5.0-windwake')
        ['assets/python-source.zip', 'assets/runtime-sdk.json', 'assets/python-build.json',
         'assets/toolchain-apk.json', 'jniLibs/arm64-v8a/libSDL3.so',
         'jniLibs/arm64-v8a/libwwhd-clang-driver.so'].each { name ->
            if (!new File(runtime, name).isFile())
                throw new GradleException('Prepare the game-free runtime first: python tools/windwake/bootstrap_android.py')
        }
        def sources = new java.util.zip.ZipFile(new File(runtime, 'assets/python-source.zip'))
        try {
            if (sources.getEntry('sdk/manifest.json') == null)
                throw new GradleException('The packaged setup sources do not contain the native runtime SDK')
        } finally { sources.close() }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyWindwakeRuntime' }

// Debug-only side-by-side install (-PwwhdDebugSuffix=.labtest): the debug APK gets its own
// applicationId so it never replaces an installed player build; its static launcher shortcuts point
// at itself. Release builds ignore it.
def debugSuffix = providers.gradleProperty('wwhdDebugSuffix').getOrElse('')
if (!debugSuffix.isEmpty()) {
    if (!(debugSuffix ==~ /\.[a-z][a-z0-9_]*/)) throw new GradleException('wwhdDebugSuffix must look like .labtest')
    android.buildTypes.debug.applicationIdSuffix = debugSuffix
    def suffixDir = layout.buildDirectory.dir('generated/debug-suffix').get().asFile
    android.sourceSets.debug.res.srcDir(new File(suffixDir, 'res'))
    def generateSuffix = tasks.register('generateDebugSuffixResources') {
        inputs.property('suffix', debugSuffix)
        inputs.file('src/main/res/xml/shortcuts.xml')
        outputs.dir(suffixDir)
        doLast {
            new File(suffixDir, 'res/xml').mkdirs()
            new File(suffixDir, 'res/xml/shortcuts.xml').text = file('src/main/res/xml/shortcuts.xml').text
                .replace('android:targetPackage="org.wwhdrecomp.wwhd"',
                         'android:targetPackage="org.wwhdrecomp.wwhd' + debugSuffix + '"')
        }
    }
    tasks.matching { it.name in ['preDebugBuild', 'mergeDebugResources', 'generateDebugResources'] }
        .configureEach { dependsOn generateSuffix }
}
